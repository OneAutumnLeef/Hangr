name: Deploy to GitHub Pages

# Trigger on every push to main, plus a manual button in the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions the official Pages actions need: read repo, write Pages,
# generate the OIDC token deploy-pages uses.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time. If a newer push comes in mid-deploy,
# cancel the in-flight job — the freshest commit wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
